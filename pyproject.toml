[project]
name = "agent-trace"
version = "0.2.0"
description = "Evidence-backed research on LLM tool routing, retrieval and prompt changes"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-trace = "agent_trace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_trace", "studies", "datasets", "configs", "tests/fixtures"]
exclude = ["/studies/**/record/**/*.html"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.sources]
"studies" = "agent_trace/studies"
"datasets" = "agent_trace/datasets"
"configs" = "agent_trace/configs"
"tests/fixtures" = "agent_trace/tests/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
